# Project information

site_name: Angela Bartz
site_author: Angela Bartz
site_url: https://abartzgit.github.io/angelabartz/

# Copyright
copyright: Copyright &copy; 2026 Angela Bartz

# Extensions
markdown_extensions:
  - attr_list
  - md_in_html

# Configuration
theme: 
  name: material
  logo: images/logo.png
  favicon: images/favicon.png
  features: 
    - navigation.expand
  palette:
    
    # Palette toggle for light mode
    - scheme: default
      primary: blue grey
      toggle:
        icon: material/lightbulb 
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      primary: black
      toggle:
        icon: material/lightbulb-outline
        name: Switch to light mode

# Navigation
nav: 
  - About me: index.md
  - My writing journey: my-writing-journey.md
  - Technical writing portfolio: my-portfolio.md
  - Blog:
    - What a tech writing manager really provides: blog/tw-manager-value.md
    